# Cloud Build pipeline for Magnolia.
# Substitute PROJECT_ID, _SERVICE_NAME, _REGION at deploy time, e.g.:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_SERVICE_NAME=magnolia-prototype,_REGION=us-central1 .
#
# _TAG defaults to "latest" so manual local `gcloud builds submit` works.
# When triggered by Cloud Build's GitHub integration, override _TAG with
# ${SHORT_SHA} via the trigger's substitution overrides.

substitutions:
  _SERVICE_NAME: magnolia-prototype
  _REGION: us-central1
  _TAG: latest
  _IMAGE: gcr.io/${PROJECT_ID}/${_SERVICE_NAME}

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${_TAG}', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:${_TAG}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=60s
      - --port=8080

images:
  - '${_IMAGE}:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
